# Development profile: runs with no external infrastructure.
# The schema is created in an in-memory H2 database on startup and dropped on shutdown,
# and DevDataSeeder loads one threshold and one alert of the sample building.
spring:
  datasource:
    url: jdbc:h2:mem:notificationsdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
